[project]
name = "garmin-postgres-core"
version = "0.1.0"
description = "Shared PostgreSQL models, config, and migrations for Garmin sync tools"
requires-python = ">=3.13"
dependencies = [
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "psycopg2-binary>=2.9.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_postgres"]

[tool.hatch.build.targets.wheel.force-include]
"src/garmin_postgres/alembic" = "garmin_postgres/alembic"
