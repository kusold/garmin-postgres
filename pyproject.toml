[project]
name = "garmin-postgres-workspace"
version = "0.1.0"
description = "Workspace for Garmin PostgreSQL archival and sync tools"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "testcontainers[postgres]>=4.9.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/notion-sync/tests"]
addopts = "-v --tb=short"
