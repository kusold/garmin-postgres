[project]
name = "garmin-postgres-workspace"
version = "0.1.0"
description = "Workspace for Garmin PostgreSQL archival and sync tools"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "testcontainers[postgres]>=4.9.0,<5",
]

[tool.uv]
package = false
# Prefect's server scheduler is incompatible with SQLAlchemy >= 2.1
# (PrefectHQ/prefect#23199 — "Can't evaluate bulk DML statement" every
# scheduler tick). Guards everything built from this lock — dev env, the
# GH Actions deploy env, and the flow-run image. Remove once upstream
# ships an upper bound on sqlalchemy.
constraint-dependencies = ["sqlalchemy<2.1"]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/notion-sync/tests", "apps/garmin-orchestrator/tests"]
addopts = "-v --tb=short"
