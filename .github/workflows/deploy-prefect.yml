name: Deploy Prefect

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-prefect.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "prefect.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "flake.nix"
      - "flake.lock"
      - "apps/garmin-orchestrator/**"
      - "apps/garmin-sync/**"
      - "packages/garmin-postgres-core/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build image and deploy Prefect deployments
    runs-on: ubuntu-latest

    env:
      PREFECT_API_URL: ${{ vars.PREFECT_API_URL || 'http://prefect.svc.rockymtn.org/api' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions-prefect-deploy
          ping: prefect.svc.rockymtn.org

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Deploy Prefect project
        env:
          GARMIN_CONNECT_ENV_FILE: ${{ vars.GARMIN_CONNECT_ENV_FILE || '/var/lib/prefect-worker-garmin-docker/garmin-connect.env' }}
          GARMIN_POSTGRES_IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          export UV_CACHE_DIR="${RUNNER_TEMP}/uv-cache"

          uv sync --locked --all-packages
          uv run --package garmin-orchestrator prefect --no-prompt concurrency-limit create garmin-api 1
          uv run --package garmin-orchestrator prefect --no-prompt deploy --all --version "${GITHUB_SHA}"
