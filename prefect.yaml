prefect-version: 3.8.0
name: garmin-postgres

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: .

definitions:
  work_pools:
    garmin_scheduled: &garmin_scheduled
      name: garmin-docker
      work_queue_name: scheduled
      job_variables: &garmin_docker_job_variables
        image: "{{ $GARMIN_POSTGRES_IMAGE }}"
        image_pull_policy: Always
        volumes:
          - "{{ $GARMIN_CONNECT_ENV_FILE }}:/app/.env:ro"
    garmin_backfill: &garmin_backfill
      name: garmin-docker
      work_queue_name: backfill
      job_variables:
        <<: *garmin_docker_job_variables
  schedules:
    twice_daily: &twice_daily
      cron: "0 6,18 * * *"
      timezone: America/Denver
    daily_notion_sync: &daily_notion_sync
      cron: "0 7 * * *"
      timezone: America/Denver
    weekly_backfill_sweep: &weekly_backfill_sweep
      cron: "0 5 * * 6"
      timezone: America/Denver

deployments:
  - name: incremental
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Twice-daily Garmin archive ingestion for all object types.
    schedule: *twice_daily
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      data_types: null
      dry_run: false
      fail_on_partial: false
    work_pool: *garmin_scheduled

  - name: daily-summary
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Daily summary ingestion only.
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      data_types:
        - daily_summary
      dry_run: false
      fail_on_partial: false
    work_pool: *garmin_scheduled

  - name: activities
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Activity ingestion only.
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      data_types:
        - activities
      dry_run: false
      fail_on_partial: false
      include_details: true
      include_files: true
    work_pool: *garmin_scheduled

  - name: personal-records
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Personal records ingestion only.
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      data_types:
        - personal_records
      dry_run: false
      fail_on_partial: false
    work_pool: *garmin_scheduled

  - name: notion-sync
    entrypoint: garmin_orchestrator.notion_flows.notion_sync_flow
    description: Daily PostgreSQL-to-Notion sync after scheduled Garmin ingestion.
    schedule: *daily_notion_sync
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      user: "f65ac324-cbcf-4438-8abe-30e8fedeec4d"
      data_types: null
      days_back: 2
      dry_run: false
      fail_on_partial: true
    work_pool: *garmin_scheduled

  - name: notion-backfill
    entrypoint: garmin_orchestrator.notion_flows.notion_backfill_flow
    description: Chunked historical PostgreSQL-to-Notion sync.
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      user: "f65ac324-cbcf-4438-8abe-30e8fedeec4d"
      data_types: null
      dry_run: false
      fail_on_partial: true
      chunk_days: 180
    work_pool: *garmin_backfill

  - name: backfill
    entrypoint: garmin_orchestrator.flows.garmin_backfill_flow
    description: Chunked historical backfill with explicit dates or days_back.
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      data_types: null
      dry_run: false
      fail_on_partial: false
      chunk_days: 30
    work_pool: *garmin_backfill

  - name: reconcile-activities
    entrypoint: garmin_orchestrator.flows.garmin_reconcile_activities_flow
    description: Manual full-history activity reconciliation.
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      dry_run: false
    work_pool: *garmin_backfill

  - name: backfill-sweep
    entrypoint: garmin_orchestrator.flows.garmin_backfill_flow
    description: >-
      Weekly re-ingest of the trailing 14 days to recover activities and daily
      summaries uploaded to Garmin Connect late (offline trips, delayed watch
      syncs). Incremental ingestion only covers yesterday, and Garmin's
      activity search filters by start date, so late uploads are otherwise
      never revisited.
    schedule: *weekly_backfill_sweep
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    parameters:
      days_back: 14
      dry_run: false
      fail_on_partial: false
    work_pool: *garmin_backfill
