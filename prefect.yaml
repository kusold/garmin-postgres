prefect-version: 3.7.5
name: garmin-postgres

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: .

definitions:
  work_pools:
    garmin: &garmin
      name: garmin
      work_queue_name: default
      job_variables:
        command: >-
          uv run --no-project --python 3.13
          --with "prefect==3.7.5"
          --with "garmin-postgres-core @ git+ssh://git@github.com/kusold/garmin-postgres.git@{{ $PREFECT_GARMIN_COMMIT_SHA }}#subdirectory=packages/garmin-postgres-core"
          --with "garmin-sync @ git+ssh://git@github.com/kusold/garmin-postgres.git@{{ $PREFECT_GARMIN_COMMIT_SHA }}#subdirectory=apps/garmin-sync"
          --with "garmin-orchestrator @ git+ssh://git@github.com/kusold/garmin-postgres.git@{{ $PREFECT_GARMIN_COMMIT_SHA }}#subdirectory=apps/garmin-orchestrator"
          python -m prefect.engine
        env:
          UV_CACHE_DIR: /tmp/garmin-postgres-uv-cache
  schedules:
    twice_daily: &twice_daily
      cron: "0 6,18 * * *"
      timezone: America/Denver

deployments:
  - name: incremental
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Twice-daily Garmin archive ingestion for all object types.
    schedule: *twice_daily
    parameters:
      data_types: null
      dry_run: false
      fail_on_partial: false
    work_pool: *garmin

  - name: daily-summary
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Daily summary ingestion only.
    parameters:
      data_types:
        - daily_summary
      dry_run: false
      fail_on_partial: false
    work_pool: *garmin

  - name: activities
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Activity ingestion only.
    parameters:
      data_types:
        - activities
      dry_run: false
      fail_on_partial: false
      include_details: true
      include_files: true
    work_pool: *garmin

  - name: personal-records
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Personal records ingestion only.
    parameters:
      data_types:
        - personal_records
      dry_run: false
      fail_on_partial: false
    work_pool: *garmin

  - name: backfill
    entrypoint: garmin_orchestrator.flows.garmin_archive_flow
    description: Manual historical backfill with explicit dates or days_back.
    parameters:
      data_types: null
      dry_run: false
      fail_on_partial: false
    work_pool: *garmin
