[project]
name = "garmin-orchestrator"
version = "0.1.0"
description = "Prefect orchestration for Garmin PostgreSQL archival"
requires-python = ">=3.13"
dependencies = [
    "garmin-postgres-core",
    "garmin-sync",
    "notion-sync",
    "prefect==3.8.0",
    # Registers the `docker` worker type (prefect.collections entry point).
    # Needed by the Nix-packaged Prefect worker on app-00, which builds its
    # venv from this workspace's uv.lock to serve the garmin-docker work pool.
    "prefect-docker",
    "typer>=0.15.0,<1",
]

[project.scripts]
garmin-orchestrator = "garmin_orchestrator.cli:app"

[tool.uv.sources]
garmin-postgres-core = { workspace = true }
garmin-sync = { workspace = true }
notion-sync = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_orchestrator"]
