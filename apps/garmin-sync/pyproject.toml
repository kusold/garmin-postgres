[project]
name = "garmin-sync"
version = "0.1.0"
description = "Archive Garmin Connect health and fitness data into PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "garmin-postgres-core",
    "garminconnect==0.2.40",
    "typer>=0.15.0",
    "curl-cffi>=0.15.0",
]

[project.scripts]
garmin-sync = "garmin_sync.cli:app"
garmin-postgres = "garmin_sync.cli:app"

[tool.uv.sources]
garmin-postgres-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_sync"]
